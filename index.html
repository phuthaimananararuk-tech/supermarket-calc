<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เทียบคุ้ม (v2.3)</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="เทียบคุ้ม (v2.3)">
    <style>
        body { background-color: #94a3b8; color: #1e293b; margin: 0; }
    </style>
</head>
<body ontouchstart="">
    <div class="app-container">
        <header class="app-header">
            <h2>เทียบคุ้ม <button onclick="forceAppUpdate()" class="app-version" title="แตะเพื่ออัปเดตทันที">v2.3</button></h2>
            <button onclick="openHistoryModal()" class="btn-history" title="ประวัติการบันทึก">📜 ประวัติ</button>
        </header>
        
        <!-- สินค้า A -->
        <div class="product-card card-a">
            <h3>สินค้า A <span id="badgeA" class="badge"></span></h3>
            <div class="input-group">
                <input type="number" id="priceA" placeholder="ราคา" inputmode="decimal" onfocus="handleFocus(this)" onblur="handleBlur(this)" oninput="handleInputChange(this)">
                <input type="number" id="weightA" placeholder="จำนวน" inputmode="decimal" onfocus="handleFocus(this)" onblur="handleBlur(this)" oninput="handleInputChange(this)">
            </div>
        </div>

        <!-- สินค้า B -->
        <div class="product-card card-b">
            <h3>สินค้า B <span id="badgeB" class="badge"></span></h3>
            <div class="input-group">
                <input type="number" id="priceB" placeholder="ราคา" inputmode="decimal" onfocus="handleFocus(this)" onblur="handleBlur(this)" oninput="handleInputChange(this)">
                <input type="number" id="weightB" placeholder="จำนวน" inputmode="decimal" onfocus="handleFocus(this)" onblur="handleBlur(this)" oninput="handleInputChange(this)">
            </div>
        </div>

        <!-- สินค้า C -->
        <div class="product-card card-c">
            <h3>สินค้า C <span id="badgeC" class="badge"></span></h3>
            <div class="input-group">
                <input type="number" id="priceC" placeholder="ราคา" inputmode="decimal" onfocus="handleFocus(this)" onblur="handleBlur(this)" oninput="handleInputChange(this)">
                <input type="number" id="weightC" placeholder="จำนวน" inputmode="decimal" onfocus="handleFocus(this)" onblur="handleBlur(this)" oninput="handleInputChange(this)">
            </div>
        </div>

        <div class="action-buttons">
            <button onclick="promptSaveRecord()" class="btn-save" id="btnSave" disabled>บันทึกรายการนี้</button>
            <button onclick="clearFields()" class="btn-clear">ล้าง</button>
        </div>

        <!-- เครดิตผู้พัฒนา -->
        <footer class="app-footer">
            <small>by Phuthai Mananararuk & Gemini</small>
        </footer>
    </div>

    <!-- Modal แสดงประวัติสินค้า -->
    <div id="historyModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>ประวัติราคาที่บันทึก</h3>
                <button onclick="closeHistoryModal()" class="btn-close">✕</button>
            </div>
            <div id="historyList" class="history-list">
                <!-- รายการประวัติจะถูกเติมเข้ามาตรงนี้ -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
