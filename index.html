<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เทียบคุ้ม - คำนวณความคุ้มค่า</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#94a3b8">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>เทียบคุ้ม</h1>
            <div class="header-actions">
                <button id="historyBtn" class="icon-btn" title="ประวัติ">📋</button>
                <button id="clearBtn" class="icon-btn" title="ล้างค่า">🗑️</button>
                <button id="versionBtn" class="version-badge" title="อัปเดตแอป">v3.1</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="content-scroll">
            <!-- สินค้า A -->
            <div class="product-card" id="card_A">
                <div class="card-header">
                    <span class="badge badge-a">สินค้า A</span>
                    <span class="unit-price-display" id="resultA">- บาท/หน่วย</span>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>ราคา</label>
                        <input type="text" id="priceA" placeholder="0" readonly inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onclick="setActiveInput(this)">
                    </div>
                    <div class="input-group">
                        <label>ปริมาณ / น้ำหนัก</label>
                        <input type="text" id="weightA" placeholder="0" readonly inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onclick="setActiveInput(this)">
                    </div>
                </div>
            </div>

            <!-- สินค้า B -->
            <div class="product-card" id="card_B">
                <div class="card-header">
                    <span class="badge badge-b">สินค้า B</span>
                    <span class="unit-price-display" id="resultB">- บาท/หน่วย</span>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>ราคา</label>
                        <input type="text" id="priceB" placeholder="0" readonly inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onclick="setActiveInput(this)">
                    </div>
                    <div class="input-group">
                        <label>ปริมาณ / น้ำหนัก</label>
                        <input type="text" id="weightB" placeholder="0" readonly inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onclick="setActiveInput(this)">
                    </div>
                </div>
            </div>

            <!-- สินค้า C -->
            <div class="product-card" id="card_C">
                <div class="card-header">
                    <span class="badge badge-c">สินค้า C</span>
                    <span class="unit-price-display" id="resultC">- บาท/หน่วย</span>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>ราคา</label>
                        <input type="text" id="priceC" placeholder="0" readonly inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onclick="setActiveInput(this)">
                    </div>
                    <div class="input-group">
                        <label>ปริมาณ / น้ำหนัก</label>
                        <input type="text" id="weightC" placeholder="0" readonly inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onclick="setActiveInput(this)">
                    </div>
                </div>
            </div>

            <!-- Summary / Comparison Banner -->
            <div class="comparison-banner" id="comparisonBanner">
                กรอกข้อมูลเพื่อเปรียบเทียบความคุ้มค่า
            </div>
        </main>

        <!-- Permanent Sticky In-App Keyboard (4 Columns) -->
        <nav class="sticky-keyboard">
            <div class="keyboard-grid">
                <!-- แถวที่ 1 -->
                <button class="key-btn" onclick="pressKey('7')">7</button>
                <button class="key-btn" onclick="pressKey('8')">8</button>
                <button class="key-btn" onclick="pressKey('9')">9</button>
                <button class="key-btn op-key" onclick="pressKey('/')">÷</button>

                <!-- แถวที่ 2 -->
                <button class="key-btn" onclick="pressKey('4')">4</button>
                <button class="key-btn" onclick="pressKey('5')">5</button>
                <button class="key-btn" onclick="pressKey('6')">6</button>
                <button class="key-btn op-key" onclick="pressKey('*')">×</button>

                <!-- แถวที่ 3 -->
                <button class="key-btn" onclick="pressKey('1')">1</button>
                <button class="key-btn" onclick="pressKey('2')">2</button>
                <button class="key-btn" onclick="pressKey('3')">3</button>
                <button class="key-btn op-key" onclick="pressKey('-')">-</button>

                <!-- แถวที่ 4 -->
                <button class="key-btn" onclick="pressKey('0')">0</button>
                <button class="key-btn" onclick="pressKey('.')">.</button>
                <button class="key-btn" onclick="pressKey('TOGGLE_BRACKET')">( )</button>
                <button class="key-btn op-key" onclick="pressKey('+')">+</button>

                <!-- แถวพิเศษด้านล่าง (รวมช่อง DEL กับ NEXT) -->
                <button class="key-btn action-del" onclick="pressKey('DEL')">⌫ DEL</button>
                <button class="key-btn action-next" onclick="pressKey('NEXT')">NEXT ➔</button>
            </div>
        </nav>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>ประวัติการเปรียบเทียบ</h3>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <div id="historyList" class="modal-body">
                <!-- รายการประวัติจะถูกเติมด้วย JS -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
