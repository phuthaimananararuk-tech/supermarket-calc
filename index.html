<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PriceCalc</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PriceCalc">
</head>
<body>
    <div class="app-container">
        <h2>⚖️ เทียบความคุ้มค่า (3 ชิ้น)</h2>
        
        <!-- สินค้า A -->
        <div class="product-card card-a">
            <h3>สินค้า A</h3>
            <div class="input-group">
                <input type="number" id="priceA" placeholder="ราคา (บาท)" inputmode="decimal" oninput="comparePrice()">
                <input type="number" id="weightA" placeholder="ปริมาณ" inputmode="decimal" oninput="comparePrice()">
            </div>
        </div>

        <!-- สินค้า B -->
        <div class="product-card card-b">
            <h3>สินค้า B</h3>
            <div class="input-group">
                <input type="number" id="priceB" placeholder="ราคา (บาท)" inputmode="decimal" oninput="comparePrice()">
                <input type="number" id="weightB" placeholder="ปริมาณ" inputmode="decimal" oninput="comparePrice()">
            </div>
        </div>

        <!-- สินค้า C (เพิ่มใหม่) -->
        <div class="product-card card-c">
            <h3>สินค้า C</h3>
            <div class="input-group">
                <input type="number" id="priceC" placeholder="ราคา (บาท)" inputmode="decimal" oninput="comparePrice()">
                <input type="number" id="weightC" placeholder="ปริมาณ" inputmode="decimal" oninput="comparePrice()">
            </div>
        </div>

        <div class="button-group">
            <button onclick="clearFields()" class="btn-clear">ล้างข้อมูลทั้งหมด</button>
        </div>

        <div id="resultCard" class="result-card hidden">
            <p id="resultText"></p>
            <small id="resultDetail"></small>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
